defaults:
  - exps: exp1
  - override hydra/launcher: submitit_slurm

hydra:
  launcher:
    _target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    cpus_per_task: 1
    tasks_per_node: 1
    nodes: 1
    name: ethical-gardeners_${hydra.job.name}
    # Change the following values if you need to increase allowed time (timeout 
    # in minutes) or RAM (memory in gigabytes)
    timeout_min: 5
    mem_gb: 4
